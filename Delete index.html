<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إلى الأميرة غنى ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #18001f, #4b123f, #17001c);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .page {
      width: 90%;
      max-width: 650px;
      padding: 30px 20px;
    }

    .heart {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 36px;
      margin: 10px 0 25px;
    }

    .photo {
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      display: block;
      margin: 0 auto 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.45);
    }

    .message {
      font-size: 19px;
      line-height: 2;
      margin-bottom: 25px;
    }

    audio {
      width: 100%;
      max-width: 450px;
      margin-top: 10px;
    }

    .question {
      margin-top: 30px;
      padding: 20px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      font-size: 20px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="heart">❤️</div>

    <h1>إلى الأميرة غنى</h1>

    <img
      src="PHOTO-2026-09-19-20-44-07.jpg"
      alt="غنى"
      class="photo"
    >

    <div class="message">
      مبروك عليكِ وصولك لهالمرحلة ❤️
      <br>
      هاي مجرد بداية لمفاجآت أكبر وأجمل.
      <br>
      وأنا فخور فيكِ وبكل خطوة عم تخطيها.
    </div>

    <audio controls preload="auto">
      <source
        src="./Adam%20-%20Ya%20Helou%20%28Official%20Music%20Video%29%20_%20%D8%A7%D9%93%D8%AF%D9%85%20-%20%D9%8A%D8%A7%20%D8%AD%D9%84%D9%88.mp3"
        type="audio/mpeg"
      >
      متصفحك لا يدعم تشغيل الصوت.
    </audio>

    <div class="question">
      هل تغير فيكِ شي أو تغيرت أولوياتكِ
      من لما تعرفنا لحد الآن؟
    </div>

  </div>

</body>
</html>
